name: Deploy Website to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    name: SFTP Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: SFTP-Client installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Dateien zu IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST:${SFTP_PORT:-22}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --parallel=4 --verbose \
              --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
              ./ /public;
            bye"
