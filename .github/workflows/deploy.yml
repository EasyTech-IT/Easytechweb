name: Deploy Website to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  preflight:
    name: Playwright Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Website-Smoke-Tests ausführen
        run: npm run test:e2e

  deploy:
    name: SFTP Deployment
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Lizenzierte Satoshi-Webfonts herunterladen
        run: python3 scripts/fetch_satoshi.py

      - name: SFTP-Client installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Dateien zu IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST:${SFTP_PORT:-22}" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --parallel=4 --verbose \
              --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
              --exclude-glob .claude/ --exclude-glob .agents/ --exclude-glob .impeccable/ \
              --exclude-glob qa/ --exclude-glob tests/ --exclude-glob scripts/ --exclude-glob node_modules/ --exclude-glob skills-lock.json \
              --exclude-glob PRODUCT.md --exclude-glob package.json --exclude-glob package-lock.json \
              ./ /;
            rm -f /js/loader.js;
            rm -f /assets/loading.mp4;
            bye"
